<header>
  <a class="brand" routerLink="/">Canasta</a>

  <nav aria-label="Navegación principal">
    <div class="account-menu">
      <button type="button" (click)="toggleAccountMenu()">Cuenta ▼</button>

      @if (accountMenuOpen()) {
        <div class="account-menu-items">
          @if (isAuthenticated()) {
            <button type="button" (click)="logout()">Cerrar sesión</button>
          } @else {
            <a routerLink="/login" (click)="closeAccountMenu()">Iniciar sesión</a>
            <a routerLink="/register" (click)="closeAccountMenu()">Registrarse</a>
          }
        </div>
      }
    </div>

    <a routerLink="/cart">Ver carrito</a>
  </nav>
</header>

<main>
  <app-product-list />
  <router-outlet />
</main>

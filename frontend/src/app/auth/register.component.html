<section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="register-title">
  <button class="close-button" type="button" aria-label="Cerrar" (click)="close()">×</button>
  <h2 id="register-title">Registrarse</h2>

  <form (ngSubmit)="submit()">
    <p>
      <label for="register-usuario">Usuario</label>
      <input id="register-usuario" name="usuario" [(ngModel)]="usuario" required />
    </p>
    <p>
      <label for="register-email">Email</label>
      <input id="register-email" name="email" type="email" [(ngModel)]="email" required />
    </p>
    <p>
      <label for="register-password">Contraseña</label>
      <input
        id="register-password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
      />
    </p>
    <button type="submit" [disabled]="isSubmitting()">Ingresar</button>
    <p class="auth-switch">
      ¿Ya tenés una cuenta?
        <button type="button" (click)="goToLogin()">
          Iniciá sesión
        </button>
    </p>
  </form>

  @if (successMessage()) {
    <p>{{ successMessage() }}</p>
  }

  @if (errorMessage()) {
    <p>{{ errorMessage() }}</p>
  }
</section>
